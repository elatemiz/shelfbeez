    @import url('https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap');

<body>

    <!-- ==================================================
         NAVBAR
    ================================================== -->

    <header class="navbar">

        <div class="container">

            <a href="index.html" class="logo">
                ShelfBeez
            </a>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="books.html">Books</a>
                <a href="profile.html">Community</a>
            </nav>

            <div class="nav-actions" id="nav-actions">
                <a href="login.html" class="login-btn">Login</a>
                <a href="register.html" class="register-btn">Sign Up</a>
            </div>

        </div>

    </header>

    
<!-- ==================== DISCOVER BOOKS ==================== -->

<section class="book-search">

    <div class="container">

        <div class="search-content">

            <p class="section-label">
                DISCOVER BOOKS
            </p>

            <h1>
                What will you read next?
            </h1>

            <p>
                Search through thousands of books
                and start creating your digital bookshelf.
            </p>

            <div class="search-options">

                <form id="book-search-form" class="discover-search-form">
                    <input
                        type="text"
                        id="book-search-input"
                        placeholder="Search books, authors..."
                    >
            
                    <button type="submit" class="register-btn">
                        Search
                    </button>
                </form>
            
                <div class="categories">
                    <a href="#" class="category-fantasy" data-query="Fantasy">Fantasy</a>
                    <a href="#" class="category-sci-fi" data-query="Science Fiction">Science Fiction</a>
                    <a href="#"  class="category-mystery" data-query="Mystery">Mystery</a>
                    <a href="#" class="category-romance" data-query="Romance">Romance</a>
                    <a href="#" class="category-classics" data-query="Classics">Classics</a>
                </div>
            
            </div>

        </div>

    </div>

</section>

    


        <!-- Book Results -->

        <section class="books-results">

            <div class="books-section-header">

                <h2>Popular Books</h2>

            </div>


            <div
                class="books-grid"
                id="books-grid"
            >

                <!-- Books will be added with JavaScript -->

            </div>

        </section>

    </main>


    <!-- ==================================================
         FOOTER
    ================================================== -->

    <footer class="footer-bottom">

        <div class="container">

            <p>

            </p>

        </div>

    </footer>


    <script src="js/main.js"></script>
    <script src="js/books.js"></script>

</body>

</html>
