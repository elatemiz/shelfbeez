<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ShelfBeez</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap');
    </style>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap');
    </style>

<body>

    <!-- ==================== NAVBAR ==================== -->
    <header class="navbar">
        <div class="container">

            <a href="index.html" class="logo">
                ShelfBeez
            </a>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="books.html">Books</a>
                <a href="profile.html">Community</a>
            </nav>

            <div class="nav-actions">
                <a href="login.html" class="login-btn">Login</a>
                <a href="register.html" class="register-btn">Sign Up</a>
            </div>

        </div>
    </header>


    </header>


    <!-- ==================== LOGIN ==================== -->
    <main class="login-page">

        <section class="login-section">

            <img src="assets/images/plant_login.svg" class="login-plant-right">

            <img src="assets/images/plant_login.svg" class="login-plant-left" alt="">

            <div class="login-card">

                <div class="login-header">
                    <h1>Welcome Back</h1>
                    <p>Log in to continue your bookshelf.</p>
                </div>


                <form class="login-form" id="login-form">

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>


                    <!-- Password -->
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>


                    <!-- Remember / Forgot -->
                    <div class="form-options">

                        <label class="remember-me">
                            <input type="checkbox" name="remember">
                            <span>Remember me</span>
                        </label>

                        <a href="#" class="forgot-password">
                            Forgot password?
                        </a>

                    </div>


                    <!-- Login Button -->
                    <button type="submit" class="login-submit">
                        Login
                    </button>

                </form>


                <!-- Register -->
                <div class="login-footer">
                    <p>
                        Don't have an account?
                        <a href="register.html">Create an account</a>
                    </p>
                </div>

            </div>

        </section>

    </main>


    <!-- ==================== FOOTER ==================== -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 ShelfBeez. All rights reserved.</p>
        </div>
    </footer>


    <script src="js/auth.js"></script>

</body>
</html>
