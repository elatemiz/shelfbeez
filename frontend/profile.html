<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Profile | ShelfBeez</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap');
    </style>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap');
    </style>

<body>

    <!-- ==================== NAVBAR ==================== -->
    <header class="navbar">
        <div class="container">

            <a href="index.html" class="logo">
                ShelfBeez
            </a>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="books.html">Books</a>
                <a href="profile.html">Community</a>
            </nav>

            <div class="nav-actions" id="nav-actions">
                <a href="login.html" class="login-btn">Login</a>
                <a href="register.html" class="register-btn">Sign Up</a>
            </div>

        </div>
    </header>

<main class="profile-page">


    <section class="profile-header">

        <div class="profile-info">

            <div class="profile-avatar">
                <img src="assets/images/profile-avatar.svg" alt="Profile avatar">
            </div>

            <div class="profile-details">
                <h1 class="profile-username" id="profile-name">name</h1>

                <p id="profile-username" class="profile-handle">
                </p>

                <p class="profile-bio">
                    Books, stories and little moments.
                </p>

                <div class="profile-stats">
                    <div class="profile-stat">
                        <span class="stat-number" id="books-count">0</span>
                        <span class="stat-label">Books</span>
                    </div>

                    <div class="profile-stat">
                        <span class="stat-number">8</span>
                        <span class="stat-label">Shelves</span>
                    </div>

                    <div class="profile-stat">
                        <span class="stat-number">15</span>
                        <span class="stat-label">Reviews</span>
                    </div>
                </div>
            </div>

        </div>

        <button class="edit-profile-btn">
            Edit Profile
        </button>

    </section>


    <!-- ==================================================
         PROFILE BOOKSHELF
    ================================================== -->

    <section class="profile-library">

        <div class="library-header">
            <div>
                <h2>My Bookshelf</h2>
                <p>A little collection of books I love.</p>
            </div>

            <button class="add-book-btn">
                + Add Book
            </button>
        </div>


        <div class="profile-bookshelf-wrapper">

            <div class="profile-bookshelves">


                <!-- ==================================================
                     LEFT BOOKSHELF
                ================================================== -->

                <div class="profile-bookshelf">

                    <div class="bookshelf-top"></div>


                    <!-- Shelf 1 -->
                    <div class="shelf-row">

                        <div class="books">
                            <!-- Books will be added with JavaScript -->
                        </div>

                    </div>


                    <!-- Shelf 2 -->
                    <div class="shelf-row">

                        <div class="books">
                            <!-- Books will be added with JavaScript -->
                        </div>

                    </div>


                    <!-- Shelf 3 -->
                    <div class="shelf-row">

                        <div class="books">
                            <!-- Books will be added with JavaScript -->
                        </div>

                    </div>


                    <!-- Shelf 4 -->
                    <div class="shelf-row">

                        <div class="books">
                            <!-- Books will be added with JavaScript -->
                        </div>

                    </div>


                    <div class="bookshelf-bottom"></div>

                </div>


                <!-- ==================================================
                     RIGHT BOOKSHELF
                ================================================== -->

                <div class="profile-bookshelf">

                    <div class="bookshelf-top"></div>


                    <!-- Shelf 1 -->
                    <div class="shelf-row">

                        <div class="books">
                            <!-- Books will be added with JavaScript -->
                        </div>

                    </div>


                    <!-- Shelf 2 -->
                    <div class="shelf-row">

                        <div class="books">
                            <!-- Books will be added with JavaScript -->
                        </div>

                    </div>


                    <!-- Shelf 3 -->
                    <div class="shelf-row">

                        <div class="books">
                            <!-- Books will be added with JavaScript -->
                        </div>

                    </div>


                    <!-- Shelf 4 -->
                    <div class="shelf-row">

                        <div class="books">
                            <!-- Books will be added with JavaScript -->
                        </div>

                    </div>


                    <div class="bookshelf-bottom"></div>

                </div>

            </div>

        </div>

    </section>


    <!-- ==================================================
         PROFILE ACTIVITY
    ================================================== -->

    <section class="profile-activity">

        <div class="section-header">
            <h2>Recent Activity</h2>
            <a href="#">View All</a>
        </div>

        <div class="activity-list">

            <article class="activity-item">

                <div class="activity-book-cover">
                    <img src="assets/images/book-placeholder.jpg" alt="Book cover">
                </div>

                <div class="activity-content">
                    <p>
                        Added <strong>Book Title</strong> to their bookshelf.
                    </p>

                    <span class="activity-date">
                        2 days ago
                    </span>
                </div>

            </article>


            <article class="activity-item">

                <div class="activity-book-cover">
                    <img src="assets/images/book-placeholder.jpg" alt="Book cover">
                </div>

                <div class="activity-content">
                    <p>
                        Finished reading <strong>Another Book</strong>.
                    </p>

                    <span class="activity-date">
                        5 days ago
                    </span>
                </div>

            </article>

        </div>

    </section>

</main>

  <script src="js/main.js"></script>
  <script src="js/profile.js"></script>
